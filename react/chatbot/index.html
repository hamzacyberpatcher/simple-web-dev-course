<!DOCTYPE html>
<html>

<head>
    <title>ChatBot</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages }) {
            const inputMessageState = React.useState('');
            const [inputMessage, setInputMessage] = inputMessageState;

            function sendMessage() {

                const newChatMessages = [...chatMessages, {
                    message: inputMessage,
                    sender: 'user',
                    key: crypto.randomUUID()
                }];

                const response = Chatbot.getResponse(inputMessage);
                
                setChatMessages([
                    ...newChatMessages,
                    {
                        message: response,
                        sender: 'robot',
                        key: crypto.randomUUID()
                    }
                ]);


                setInputMessage('');
            }

            function inputMessageSetting(event) {
                setInputMessage(event.target.value);
            }

            return (
                <div>
                    <input
                        placeholder="Ask something from me"
                        size="30"
                        onChange={inputMessageSetting}
                        value={inputMessage}
                    />
                    <button onClick={sendMessage}>Send</button>
                </div>
            );
        }

        function MsgBox({ message, sender }) {
            return (
                <div>
                    { sender === 'robot' &&  <img src="./img/robot.png" width="50px" />}
                    { message }
                    { sender === 'user' &&  <img src="./img/user.png" width="50px" />}
                </div>
            );
        }

        function ChatMessages({chatMessages}) {

            return (<>
                    {chatMessages.map(chatMessage => {
                        return (
                            <MsgBox 
                            message={chatMessage.message}
                            sender={chatMessage.sender}
                            key={chatMessage.key}
                            />
                        );
                    })}
                    </>
                )
        }

        function App() {
            const array = React.useState([]);

            const [chatMessages, setChatMessages] = array;

            return (
                <>
                    <ChatInput
                    chatMessages={chatMessages}
                    setChatMessages = {setChatMessages}
                     />
                    <ChatMessages
                    chatMessages={chatMessages}
                     />
                    
                </>
            );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
